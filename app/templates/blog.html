<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog | Abdelrahman Nayf</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
        <a href="/blog/new" class="btn-nav">+ New Post</a>
    </nav>
    <div class="container">
        <h2>Blog Posts</h2>
        {% if posts %}
            {% for post in posts %}
            <div class="card">
                <h3><a href="/blog/{{ post.id }}">{{ post.title }}</a></h3>
                <p class="date">{{ post.date.strftime('%B %d, %Y') }}</p>
                <p>{{ post.content[:150] }}...</p>
            </div>
            {% endfor %}
        {% else %}
            <p>No posts yet. <a href="/blog/new">Write the first one!</a></p>
        {% endif %}
    </div>
</body>
</html>
