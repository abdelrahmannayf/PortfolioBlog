version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio123
      POSTGRES_DB: portfoliodb
    volumes:
      - pgdata:/var/lib/postgresql/data

  flask:
    build: .
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio123@db:5432/portfoliodb
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask

volumes:
  pgdata:
